name: Fieldwork signal zero current-head

on:
  pull_request:
    branches:
      - fieldwork/kill-descendants-signal-zero
    paths:
      - .github/workflows/fieldwork-signal-zero-current.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: 38efe3b8197601e5c658c17583a54f5fb3469163
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity and fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "38efe3b8197601e5c658c17583a54f5fb3469163"
          git diff --check 8017b279e19347efaf2587711c2d57dbd4330740..HEAD
          git diff --name-only 8017b279e19347efaf2587711c2d57dbd4330740..HEAD | sort > actual
          printf '%s\n' \
            lib/terminate/kill-descendants.js \
            test/terminate/kill-descendants-signal-zero.js \
            test/terminate/kill-descendants.js | sort > expected
          diff -u expected actual
          rm actual expected

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Lint repository
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 26 }}
        run: npm run lint

      - name: Run signal-zero and descendant controls
        run: npx ava test/terminate/kill-descendants-signal-zero.js test/terminate/kill-descendants.js

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "38efe3b8197601e5c658c17583a54f5fb3469163"
          test -z "$(git status --porcelain)"
